name: Build Android APK

# Builds the Peday Commission app into an installable APK in the cloud.
# GitHub's ubuntu runners already have the Android SDK, so nothing local is needed.
# Trigger: push to main, or run manually from the Actions tab.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        # GitHub's ubuntu runners already ship the Android SDK. The
        # android-actions/setup-android action started failing after a runner
        # image update (it requests a cmdline-tools version that mismatches the
        # preinstalled one and then hangs on an interactive licence prompt), so
        # we skip it and just accept licences on the preinstalled SDK.
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if missing) & sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "===== GRADLE FAILURE (tail) ====="
            tail -80 ../build.log
            msg=$(grep -A3 -iE "what went wrong|FAILURE:|Could not|not found|Unresolved|Duplicate class|Manifest merger" ../build.log | head -12 | tr '\n' '~' | tr -d '\r' | cut -c1-800)
            echo "::error::$msg"
          fi
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peday-commission-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
